# ----------------------------------------
# Production Configuration (Render.com)
# ----------------------------------------

# MySQL (Render gives DATABASE_URL as env variable)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Server Port (Render provides PORT as env variable)
server.port=${PORT:8080}

# File upload storage path (Render)
file.upload-dir=/opt/render/project/src/uploads/
